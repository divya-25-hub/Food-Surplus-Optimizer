<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Requests - FoodShare</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5fbf8, #eef7f4);
        }

        .page-wrapper {
            min-height: 100vh;
            padding: 40px 20px;
        }

        .back-btn {
            display: flex;
            max-width: 900px;
            margin: 0 auto 25px;
            text-decoration: none;
            color: #145a50;
            font-weight: 600;
            transition: 0.2s;
        }

        .back-btn:hover {
            transform: translateX(-3px);
        }

        .requests-card {
            max-width: 900px;
            margin: auto;
            background: rgba(255,255,255,0.97);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 45px rgba(20,90,80,0.12);
            animation: appear 0.6s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .request-icon {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 18px;
            background: linear-gradient(135deg, #145a50, #2c8b79);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 25px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(20,90,80,0.2);
        }

        .header h1 {
            margin: 18px 0 8px;
            color: #145a50;
            font-family: Georgia, serif;
            font-size: 34px;
        }

        .header p {
            margin: 0;
            color: #777;
        }

        #requestsList {
            display: grid;
            gap: 18px;
        }

        .request-item {
            background: #f8fbfa;
            border: 1px solid #dce9e5;
            border-left: 5px solid #145a50;
            border-radius: 14px;
            padding: 22px;
            transition: 0.25s ease;
        }

        .request-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(20,90,80,0.10);
        }

        .request-number {
            font-size: 12px;
            color: #777;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .request-food {
            font-size: 21px;
            font-weight: 700;
            color: #145a50;
            margin-bottom: 12px;
        }

        .request-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .detail-box {
            background: white;
            padding: 12px;
            border-radius: 9px;
            border: 1px solid #e4ece9;
        }

        .detail-label {
            display: block;
            font-size: 12px;
            color: #777;
            margin-bottom: 5px;
        }

        .detail-value {
            font-weight: 600;
            color: #333;
            word-break: break-word;
        }

        .empty-message,
        .error-message {
            text-align: center;
            padding: 30px;
            border-radius: 12px;
        }

        .empty-message {
            background: #f2f7f5;
            color: #63736f;
        }

        .error-message {
            background: #fdecec;
            color: #a33a3a;
        }

        .refresh-btn {
            display: block;
            margin: 25px auto 0;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #145a50;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .refresh-btn:hover {
            background: #0e463e;
            transform: translateY(-2px);
        }

        @media (max-width: 650px) {

            .requests-card {
                padding: 25px 18px;
            }

            .header h1 {
                font-size: 28px;
            }

            .request-details {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

<div class="page-wrapper">

    <a href="dashboard.html" class="back-btn">
        ← Back to Dashboard
    </a>

    <div class="requests-card">

        <div class="header">

            <div class="request-icon">
                FR
            </div>

            <h1>Food Requests</h1>

            <p>
                View food requests currently maintained in the request queue.
            </p>

        </div>

        <div id="requestsList">
            <div class="empty-message">
                Loading food requests...
            </div>
        </div>

        <button class="refresh-btn" onclick="loadRequests()">
            Refresh Requests
        </button>

    </div>

</div>


<script>

    // Check login

    const loggedInUser =
        JSON.parse(localStorage.getItem("loggedInUser"));

    if (!loggedInUser) {
        window.location.href = "login.html";
    }


    // Load requests

    function loadRequests() {

        const requestsList =
            document.getElementById("requestsList");

        requestsList.innerHTML =
            '<div class="empty-message">Loading food requests...</div>';


        const formData =
            new URLSearchParams();

        formData.append(
            "action",
            "viewRequests"
        );


        fetch("foodshare", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded"
            },

            body: formData.toString()

        })

        .then(response => response.json())

        .then(data => {

            const requests =
                data.requests || data;


            if (!Array.isArray(requests) ||
                requests.length === 0) {

                requestsList.innerHTML =
                    `
                    <div class="empty-message">
                        No food requests are currently available.
                    </div>
                    `;

                return;
            }


            requestsList.innerHTML = "";


            requests.forEach((request, index) => {

                const requestCard =
                    document.createElement("div");

                requestCard.className =
                    "request-item";


                requestCard.innerHTML = `

                    <div class="request-number">
                        Request ${index + 1}
                    </div>

                    <div class="request-food">
                        ${request.foodRequired || "Food Request"}
                    </div>

                    <div class="request-details">

                        <div class="detail-box">

                            <span class="detail-label">
                                Request ID
                            </span>

                            <span class="detail-value">
                                ${request.requestId || "N/A"}
                            </span>

                        </div>

                        <div class="detail-box">

                            <span class="detail-label">
                                Recipient
                            </span>

                            <span class="detail-value">
                                ${request.recipientName || "N/A"}
                            </span>

                        </div>

                        <div class="detail-box">

                            <span class="detail-label">
                                Quantity
                            </span>

                            <span class="detail-value">
                                ${request.quantityRequired || 0} kg
                            </span>

                        </div>

                    </div>
                `;


                requestsList.appendChild(requestCard);

            });

        })

        .catch(error => {

            console.error(error);

            requestsList.innerHTML =
                `
                <div class="error-message">
                    Unable to connect to the server.
                </div>
                `;

        });

    }


    // Load when page opens

    loadRequests();

</script>

</body>
</html>
