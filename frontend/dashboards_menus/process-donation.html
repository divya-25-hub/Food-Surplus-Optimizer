<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Match & Distribute | FoodShare</title><link rel="stylesheet" href="style.css">
<style>
body{margin:0;background:#f4f8f5;font-family:Arial,sans-serif;color:#243b31}.page{max-width:1050px;margin:0 auto;padding:32px 20px 60px}.back{border:0;background:none;color:#176b4b;font-weight:700;cursor:pointer;padding:8px 0;margin-bottom:16px}.heading{margin-bottom:22px}.heading h1{margin:0 0 8px;color:#174b37}.heading p{margin:0;color:#718078;line-height:1.5}.panel{background:#fff;border:1px solid #e2ece6;border-radius:18px;padding:24px;box-shadow:0 8px 24px rgba(24,60,49,.05);margin-bottom:20px}.panel h2{margin:0 0 16px;font-size:19px;color:#1d4b39}.donation-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.detail{background:#f6faf7;border-radius:12px;padding:14px}.detail span{display:block;color:#7a8b81;font-size:12px;margin-bottom:6px}.detail strong{color:#244c3a}.primary,.secondary,.select-btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:#176b4b;color:#fff}.primary:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#eaf2ed;color:#315b45}.select-btn{background:#eaf5ee;color:#176b4b}.recipient-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.recipient-card{border:1px solid #e0eae4;border-radius:13px;padding:17px;background:#fff}.recipient-card.selected{border:2px solid #25875a;background:#f5fbf7}.recipient-card h3{margin:0 0 8px;color:#214d39}.recipient-card p{margin:5px 0;color:#718078;font-size:13px}.message{padding:13px 15px;border-radius:10px;margin:16px 0;display:none;line-height:1.5}.message.show{display:block}.message.info{background:#edf5f0;color:#315b45}.message.error{background:#fff0ed;color:#9a3d2e}.message.success{background:#eaf7ef;color:#21633f}.selected-details{background:#f6faf7;border-radius:12px;padding:18px;margin-top:16px;display:none}.selected-details.show{display:block}.selected-details p{margin:7px 0;color:#53665b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}@media(max-width:600px){.panel{padding:18px}.page{padding:22px 14px}}
</style></head><body><main class="page"><button class="back" onclick="location.href='../dashboard.html'">← Back to Dashboard</button><header class="heading"><h1>Match & Distribute Food</h1><p>Review the next available donation, select an eligible recipient and confirm the distribution.</p></header>
<div id="message" class="message"></div><section id="donationPanel" class="panel" style="display:none"><h2>Donation Details</h2><div class="donation-grid"><div class="detail"><span>Food item</span><strong id="foodName">—</strong></div><div class="detail"><span>Available quantity</span><strong id="quantity">—</strong></div><div class="detail"><span>Donor</span><strong id="donorName">—</strong></div><div class="detail"><span>Donation reference</span><strong id="donationId">—</strong></div></div></section>
<section id="recipientsPanel" class="panel" style="display:none"><h2>Matching Recipients</h2><p style="color:#718078;margin-top:-8px">Select a recipient to review their full contact details before confirming.</p><div id="recipientList" class="recipient-list"></div><div id="selectedDetails" class="selected-details"></div><div class="actions"><button id="confirmButton" class="primary" disabled onclick="confirmSelected()">Confirm Distribution</button><button class="secondary" onclick="loadDonation()">Refresh Matches</button></div></section>
</main><script>
let currentDonationId=null;let selectedRecipient=null;let currentMatches=[];
function showMessage(text,type='info'){const box=document.getElementById('message');box.textContent=text;box.className='message show '+type;}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function post(data){const body=new URLSearchParams(data);const response=await fetch('../foodshare',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});return response.json();}
async function loadDonation(){selectedRecipient=null;currentDonationId=null;document.getElementById('donationPanel').style.display='none';document.getElementById('recipientsPanel').style.display='none';document.getElementById('selectedDetails').className='selected-details';document.getElementById('confirmButton').disabled=true;showMessage('Checking the next available donation...');try{const data=await post({action:'processDonation'});if(!data.success){showMessage(data.message||'No pending donations are available.','info');return;}currentDonationId=data.donationId;document.getElementById('foodName').textContent=data.foodName;document.getElementById('quantity').textContent=data.quantity;document.getElementById('donorName').textContent=data.donorName||'Donor information unavailable';document.getElementById('donationId').textContent=data.donationId;document.getElementById('donationPanel').style.display='block';if(!data.matches||data.matches.length===0){showMessage(data.message||'No matching recipient found. This donation remains available.','info');return;}currentMatches=data.matches;renderRecipients();document.getElementById('recipientsPanel').style.display='block';showMessage(data.message,'info');}catch(e){console.error(e);showMessage('Unable to connect to the FoodShare server.','error');}}
function renderRecipients(){const list=document.getElementById('recipientList');list.innerHTML='';currentMatches.forEach((r,index)=>{const card=document.createElement('article');card.className='recipient-card';card.innerHTML=`<h3>${esc(r.name)}</h3><p>Food required: <strong>${esc(document.getElementById('foodName').textContent)}</strong></p><p>Quantity required: <strong>${esc(r.quantity)}</strong></p><button class="select-btn" type="button">Select Recipient</button>`;card.querySelector('button').addEventListener('click',()=>selectRecipient(index,card));list.appendChild(card);});}
function selectRecipient(index,card){selectedRecipient=currentMatches[index];document.querySelectorAll('.recipient-card').forEach(c=>c.classList.remove('selected'));card.classList.add('selected');const d=document.getElementById('selectedDetails');d.innerHTML=`<h3 style="margin:0 0 12px;color:#1d4b39">Selected Recipient Details</h3><p><strong>Name:</strong> ${esc(selectedRecipient.name)}</p><p><strong>Phone:</strong> ${esc(selectedRecipient.phone||'Not provided')}</p><p><strong>Email:</strong> ${esc(selectedRecipient.email||'Not provided')}</p><p><strong>Address:</strong> ${esc(selectedRecipient.address||'Not provided')}</p><p><strong>Food required:</strong> ${esc(document.getElementById('foodName').textContent)}</p><p><strong>Quantity required:</strong> ${esc(selectedRecipient.quantity)}</p>`;d.className='selected-details show';document.getElementById('confirmButton').disabled=false;}
async function confirmSelected(){if(!selectedRecipient||!currentDonationId)return;const button=document.getElementById('confirmButton');button.disabled=true;button.textContent='Confirming...';try{const data=await post({action:'confirmDonation',donationId:currentDonationId,needId:selectedRecipient.needId});if(data.success){showMessage(data.message+' Recipient: '+data.recipientName,'success');document.getElementById('recipientsPanel').style.display='none';document.getElementById('donationPanel').style.display='none';}else{showMessage(data.message||'Could not confirm distribution.','error');button.disabled=false;}}catch(e){console.error(e);showMessage('Unable to confirm the distribution. Please try again.','error');button.disabled=false;}finally{button.textContent='Confirm Distribution';}}
loadDonation();
</script></body></html>
