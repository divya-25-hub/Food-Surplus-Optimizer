<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Food Request - FoodShare</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5fbf8, #eef7f4);
        }

        .page-wrapper {
            min-height: 100vh;
            padding: 40px 20px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #145a50;
            font-weight: 600;
            margin: 0 auto 25px;
            max-width: 760px;
        }

        .back-btn:hover {
            color: #0d4038;
            transform: translateX(-3px);
            transition: 0.2s;
        }

        .request-card {
            max-width: 760px;
            margin: auto;
            background: rgba(255,255,255,0.97);
            border-radius: 24px;
            padding: 42px;
            box-shadow: 0 15px 45px rgba(20,90,80,0.12);
            border: 1px solid rgba(20,90,80,0.08);
            animation: cardAppear 0.6s ease;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .request-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .request-icon {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 18px;
            background: linear-gradient(135deg, #145a50, #2c8b79);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(20,90,80,0.22);
        }

        .request-header h1 {
            margin: 20px 0 8px;
            color: #145a50;
            font-family: Georgia, serif;
            font-size: 34px;
        }

        .request-header p {
            margin: 0;
            color: #777;
            font-size: 15px;
        }

        .form-group { margin-bottom: 23px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #294943;
        }

        .required { color: #d9534f; }

        .input-wrapper { position: relative; }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #d9e5e1;
            border-radius: 11px;
            background: #fbfdfc;
            font-size: 15px;
            color: #333;
            transition: all 0.25s ease;
        }

        .input-wrapper input:hover { border-color: #9fc8be; }

        .input-wrapper input:focus {
            outline: none;
            background: white;
            border-color: #145a50;
            box-shadow: 0 0 0 4px rgba(20,90,80,0.08);
        }

        .readonly-input {
            background: #f1f7f5 !important;
            color: #4d6c65 !important;
            cursor: not-allowed;
        }

        .field-note {
            display: block;
            margin-top: 7px;
            color: #71847e;
            font-size: 12px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            border: 1.5px solid #d9e5e1;
            border-radius: 11px;
            overflow: hidden;
            background: #fbfdfc;
        }

        .quantity-box button {
            width: 48px;
            height: 48px;
            border: none;
            background: #edf5f2;
            color: #145a50;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .quantity-box button:hover { background: #dcece7; }

        .quantity-box input {
            flex: 1;
            min-width: 0;
            height: 48px;
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            background: white;
        }

        .quantity-box input:focus { outline: none; }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .submit-btn, .cancel-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 11px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .submit-btn {
            background: linear-gradient(135deg, #145a50, #2c8b79);
            color: white;
            box-shadow: 0 7px 18px rgba(20,90,80,0.2);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 23px rgba(20,90,80,0.28);
        }

        .submit-btn:disabled {
            opacity: 0.65;
            cursor: wait;
            transform: none;
        }

        .cancel-btn {
            background: #f1f3f2;
            color: #555;
        }

        .cancel-btn:hover { background: #e5e9e7; }

        .message {
            margin-top: 22px;
            padding: 14px 16px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            display: none;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .success {
            display: block;
            background: #e8f6ee;
            color: #176b3a;
            border: 1px solid #b9dfc8;
        }

        .error {
            display: block;
            background: #fdecec;
            color: #a33a3a;
            border: 1px solid #efc1c1;
        }

        @media (max-width: 600px) {
            .page-wrapper { padding: 25px 15px; }
            .request-card { padding: 28px 22px; }
            .request-header h1 { font-size: 28px; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>

<body>
<div class="page-wrapper">

    <a href="dashboard.html" class="back-btn">
        ← Back to Dashboard
    </a>

    <div class="request-card">

        <div class="request-header">
            <div class="request-icon">FR</div>
            <h1>Food Request</h1>
            <p>
                Tell us what food is needed and we'll add it to the request queue.
            </p>
        </div>

        <form id="requestForm">
           
            <!-- Request ID: generated automatically by Java -->
            <div class="form-group" id="requestIdGroup" style="display: none;">
                <label for="requestId">Generated Request ID</label>
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="requestId"
                        class="readonly-input"
                        readonly
                    >
                </div>
                <small class="field-note">
                    Keep this ID for future reference.
                </small>
            </div>


            <!-- Logged-in user -->
            <div class="form-group">
                <label for="recipientName">Recipient Name</label>
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="recipientName"
                        class="readonly-input"
                        readonly
                    >
                </div>
            </div>

            <!-- Food -->
            <div class="form-group">
                <label for="foodRequired">
                    Food Required <span class="required">*</span>
                </label>
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="foodRequired"
                        placeholder="Example: Rice, Chapati, Bread"
                        required
                    >
                </div>
            </div>

            <!-- Quantity -->
            <div class="form-group">
                <label for="quantityRequired">
                    Quantity Required <span class="required">*</span>
                </label>
                <div class="quantity-box">
                    <button type="button" onclick="changeQuantity(-1)">−</button>
                    <input
                        type="number"
                        id="quantityRequired"
                        value="1"
                        min="1"
                        step="1"
                        required
                    >
                    <button type="button" onclick="changeQuantity(1)">+</button>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="submit-btn" id="submitBtn">
                    Submit Request
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="window.location.href='dashboard.html'"
                >
                    Cancel
                </button>
            </div>

        </form>

        <div id="message" class="message" role="status" aria-live="polite"></div>

    </div>
</div>

<script>
    // Check login
    const loggedInUser =
        JSON.parse(localStorage.getItem("loggedInUser"));

    if (!loggedInUser) {
        window.location.href = "login.html";
    } else {
        document.getElementById("recipientName").value =
            loggedInUser.name || loggedInUser.username || "";
    }

    // Quantity controls
    function changeQuantity(change) {
        const quantity = document.getElementById("quantityRequired");
        let value = parseInt(quantity.value, 10) || 1;

        value += change;

        if (value < 1) {
            value = 1;
        }

        quantity.value = value;
    }

    // Submit form
    document.getElementById("requestForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const recipientName =
                document.getElementById("recipientName").value.trim();

            const foodRequired =
                document.getElementById("foodRequired").value.trim();

            const quantityInput =
                document.getElementById("quantityRequired");

            const quantityRequired =
                Number(quantityInput.value);

            const message =
                document.getElementById("message");

            const submitBtn =
                document.getElementById("submitBtn");

            if (
                !recipientName ||
                !foodRequired ||
                !Number.isInteger(quantityRequired) ||
                quantityRequired < 1
            ) {
                message.textContent =
                    "Please provide valid food and quantity details.";

                message.className = "message error";
                return;
            }

            const formData = new URLSearchParams();

            formData.append("action", "addRequest");
            formData.append("recipientName", recipientName);
            formData.append("foodRequired", foodRequired);
            formData.append("quantityRequired", String(quantityRequired));

            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";

            message.className = "message";
            message.textContent = "";

            try {
                const response = await fetch("foodshare", {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body: formData.toString()
                });

                if (!response.ok) {
                    throw new Error("Server returned status " + response.status);
                }

                const data = await response.json();

                if (data.success) {
                    const generatedId = data.requestId;

                    if (generatedId) {
                        document.getElementById("requestId").value = generatedId;

                        document.getElementById("requestIdGroup").style.display = "block";

                        message.textContent =
                            data.message + " Your Request ID is " + generatedId + ".";
                    } else {
                        message.textContent = data.message ||
                            "Food request added successfully.";
                    }

                    message.className = "message success";

                    // Keep the confirmation visible so the user can read the ID.
                    submitBtn.textContent = "Request Submitted";

                    setTimeout(function() {
                        window.location.href = "dashboard.html";
                    }, 2500);

                } else {
                    message.textContent =
                        data.message || "Failed to add food request.";

                    message.className = "message error";
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit Request";
                }

            } catch (error) {
                console.error(error);

                message.textContent =
                    "Unable to connect to the server. Please try again.";

                message.className = "message error";
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Request";
            }
        });
</script>

</body>
</html>
